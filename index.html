<style>
  :root { --ink: #2c3550; --tile: #5d6fcf; --tile-hi: #7c8de6; --tile-lo: #4656ad; }

  .tile { width: 64px; padding: 8px 0 6px; border-radius: 14px; background: linear-gradient(var(--tile-hi), var(--tile) 40%, var(--tile-lo)); box-shadow: 0 3px 0 #3a4796, 0 6px 14px rgba(40,50,110,.25); text-align: center; color: #fff; }
  .tile b { display: block; font-size: 17px; font-weight: 800; letter-spacing: .2px; text-shadow: 0 2px 0 rgba(30,36,90,.55); margin-top: 4px; }
  .cube { position: relative; width: 26px; height: 28px; margin: 0 auto; }
  .cube i { position: absolute; display: block; }
  .cube .t { width: 18.4px; height: 18.4px; left: 3.8px; top: -1px; transform: rotate(45deg) skew(-8deg,-8deg) scale(.82,.82); transform-origin: center; border-radius: 3px; }
  .cube .t { transform: translateY(2px) scaleY(.58) rotate(45deg); border-radius: 3px; }
  .cube .l { left: 0; top: 8px; width: 13px; height: 17px; transform: skewY(30deg); border-radius: 2px 0 2px 3px; }
  .cube .r { right: 0; top: 8px; width: 13px; height: 17px; transform: skewY(-30deg); border-radius: 0 2px 3px 2px; }
  .total { width: 100%; color: var(--ink); opacity: .7; font-size: 12px; font-weight: 700; padding-left: 2px; }
  #size { position: fixed; left: 0; top: 0; pointer-events: none; will-change: transform; }

  #size.bump span { animation: bump .7s ease-out; }
  #size { transition: opacity .5s; } #size.gone { opacity: 0; }
  @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.5); } 100% { transform: scale(1); } }
  .btns { position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: 12px; display: flex; gap: 8px; }
  .btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255,255,255,.55); backdrop-filter: blur(6px); display: grid; place-items: center; color: var(--ink); padding: 0; }
  .btn svg { width: 20px; height: 20px; }
  #mute .x { display: none; } #mute.off .x { display: inline; } #mute.off .w { display: none; }
  #hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 13%); transform: translateX(-50%); color: var(--ink); background: rgba(255,255,255,.6); padding: 8px 16px; border-radius: 99px; font-weight: 700; font-size: 14px; pointer-events: none; transition: opacity .8s; }
  #arrow { position: fixed; left: 0; top: 0; width: 34px; height: 34px; pointer-events: none; transition: opacity .4s; }
  #arrow svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(5px); } }
  #stick { position: fixed; width: 0; height: 0; pointer-events: none; transition: opacity .25s; }
  #stick::before { content: ""; position: absolute; left: calc(-1 * var(--r, 46px)); top: calc(-1 * var(--r, 46px)); width: calc(2 * var(--r, 46px)); height: calc(2 * var(--r, 46px)); border-radius: 50%; border: 2px solid rgba(255,255,255,.75); background: rgba(255,255,255,.12); }
  #stick i { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 2px 6px rgba(40,50,90,.25); }
  .gone { opacity: 0 !important; pointer-events: none !important; }
  .screen { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(214,236,248,.55); backdrop-filter: blur(5px); transition: opacity .6s; text-align: center; color: var(--ink); }
  .screen h1 { font-size: 64px; margin: 0; letter-spacing: 10px; font-weight: 900; color: #2a2f45; text-shadow: 0 4px 0 rgba(255,255,255,.7); }
  .screen p { margin: 6px 0 30px; font-size: 16px; font-weight: 600; opacity: .75; }
  .pill { display: inline-block; padding: 14px 34px; border-radius: 99px; background: #2a2f45; color: #fff; font-weight: 800; font-size: 18px; border: 0; box-shadow: 0 6px 16px rgba(30,40,80,.25); font-family: inherit; }
  .hole-ic { width: 120px; height: 46px; border-radius: 50%; background: radial-gradient(#05060a 55%, #1b1e2c 70%); margin: 0 auto 26px; box-shadow: 0 0 0 4px #fbf6ea, 0 0 0 7px rgba(255,173,66,.0); }
  .panel { padding-inline: max(16px, env(safe-area-inset-left)); max-width: 460px; }
  .screen h1.small { font-size: 40px; letter-spacing: 4px; }
  #cards { display: grid; gap: 12px; width: min(340px, 86vw); margin: 0 auto; }
  .card { display: grid; grid-template-columns: 64px 1fr; grid-template-rows: auto auto auto; align-content: center; column-gap: 14px; align-items: center; text-align: left; padding: 12px 16px 12px 12px; border: 0; border-radius: 18px; background: rgba(255,255,255,.82); box-shadow: 0 6px 18px rgba(30,40,80,.14); font-family: inherit; color: var(--ink); cursor: pointer; transition: transform .15s; }
  .card:active { transform: scale(.97); }
  .card:focus-visible, .pill:focus-visible { outline: 3px solid #ff9b3d; outline-offset: 3px; }
  .card .art { grid-row: 1 / 4; width: 64px; height: 64px; border-radius: 14px; position: relative; overflow: hidden; }
  .card .name { font-size: 20px; font-weight: 900; letter-spacing: .5px; }
  .card .tag { font-size: 13px; font-weight: 600; opacity: .7; }
  .card .best { font-size: 12px; font-weight: 800; color: #2f8a4c; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card .badge { position: absolute; right: 3px; top: 3px; z-index: 2; width: 20px; height: 20px; border-radius: 50%; background: #ffc83d; color: #2a2f45; font-size: 13px; font-weight: 900; line-height: 20px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .card-farm .art { background: linear-gradient(#bfe3f6 0 38%, #9fd47c 38%); }
  .card-farm .art::before { content: ""; position: absolute; left: 12px; top: 16px; width: 24px; height: 22px; background: #e0605a; box-shadow: 0 -8px 0 -2px #8c5a52, 26px 4px 0 -6px #f2cf6b, 30px 12px 0 -6px #f2cf6b; border-radius: 3px; }
  .card-farm .art::after { content: ""; position: absolute; left: 14px; bottom: 6px; width: 36px; height: 12px; border-radius: 50%; background: #07080d; box-shadow: 0 0 0 2px #fbf6ea; }
  .card-reef .art { background: linear-gradient(#5fb7d6 0 45%, #ecd9a0 45%); }
  .card-reef .art::before { content: ""; position: absolute; left: 10px; top: 14px; width: 8px; height: 20px; background: #ff8f8f; box-shadow: 10px 6px 0 #b48ef0, 20px -2px 0 #ff9f5a, 32px 8px 0 #4fae6a, 22px -10px 0 -2px #ffd84d; border-radius: 3px; }
  .card-reef .art::after { content: ""; position: absolute; left: 14px; bottom: 6px; width: 36px; height: 12px; border-radius: 50%; background: #07080d; box-shadow: 0 0 0 2px #fbf6ea; }
  .card-valley .art { background: linear-gradient(#cfe9f7 0 30%, #8fcf6b 30%); }
  .card-valley .art::before { content: ""; position: absolute; left: 6px; top: 10px; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 20px solid #7f838c; filter: drop-shadow(22px 4px 0 #6e727b); }
  .card-valley .art::after { content: ""; position: absolute; left: 14px; bottom: 6px; width: 36px; height: 12px; border-radius: 50%; background: #07080d; box-shadow: 0 0 0 2px #fbf6ea, -8px -14px 0 -2px #3f8f5a, 30px -16px 0 -2px #3f8f5a; }
  .card-castle .art { background: linear-gradient(#cfe9f7 0 40%, #93cf6e 40%); }
  .card-castle .art::before { content: ""; position: absolute; left: 10px; top: 14px; width: 44px; height: 22px; background: #c4bfb5; box-shadow: 0 -6px 0 -1px #c4bfb5; clip-path: polygon(0 0, 10% 0, 10% 20%, 25% 20%, 25% 0, 40% 0, 40% 20%, 60% 20%, 60% 0, 75% 0, 75% 20%, 90% 20%, 90% 0, 100% 0, 100% 100%, 0 100%); }
  .card-castle .art::after { content: ""; position: absolute; left: 14px; bottom: 6px; width: 36px; height: 12px; border-radius: 50%; background: #07080d; box-shadow: 0 0 0 2px #fbf6ea, 10px -26px 0 -4px #c9443f; }
  .card-stadium .art { background: repeating-linear-gradient(135deg, #5fb85a 0 8px, #69c264 8px 16px); }
  .card-stadium .art::before { content: ""; position: absolute; left: 22px; top: 12px; width: 20px; height: 20px; background: #c98e5a; transform: rotate(45deg); box-shadow: inset 0 0 0 5px #c98e5a, inset 0 0 0 20px #5fb85a; border: 2px solid #fff; }
  .card-stadium .art::after { content: ""; position: absolute; left: 14px; bottom: 6px; width: 36px; height: 12px; border-radius: 50%; background: #07080d; box-shadow: 0 0 0 2px #fbf6ea; }
  .card-beach .art { background: linear-gradient(#6ec6e8 0 34%, #efd9a0 34%); }
  .card-beach .art::before { content: ""; position: absolute; left: 30px; top: 12px; width: 26px; height: 13px; border-radius: 13px 13px 0 0; background: repeating-linear-gradient(90deg, #e2574f 0 5px, #fff 5px 10px); box-shadow: -14px 20px 0 -4px #ea5a3f; }
  .card-beach .art::after { content: ""; position: absolute; left: 14px; bottom: 6px; width: 36px; height: 12px; border-radius: 50%; background: #07080d; box-shadow: 0 0 0 2px #fbf6ea; }
  .stats { font-size: 14px; font-weight: 800; opacity: .7; margin: -18px 0 26px; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .pill.ghost { background: rgba(255,255,255,.8); color: #2a2f45; }
  .row.second { margin-top: 10px; }
  .screen { overflow-y: auto; }
  .screen > .panel { padding-block: 16px; }
  @media (max-height: 860px) {
    .screen h1 { font-size: 48px; }

  .card-haunted .art { background: linear-gradient(#2b2550, #4a4372 60%, #5d6a58 60%); }

<canvas id="game"></canvas>
<div id="hud"></div>

    <button class="pill ghost" id="exit">Exit app</button>
  </div>
</div></div>
<div class="screen gone" id="bye"><div class="panel">
  <div class="hole-ic"></div>
  <h1 class="small">See you soon</h1>
  <p>Your phone didn't let the game close itself. Swipe the app away to finish.</p>
  <div class="row"><button class="pill ghost" id="bye-menu">Back to the menu</button></div>
